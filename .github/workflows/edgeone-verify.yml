name: EdgeOne Makers verification

on:
  push:
    branches:
      - main
      - feat/edgeone-makers-deploy
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "httpx>=0.27,<1.0"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile application and Makers functions
        run: python -m compileall -q app cloud-functions scripts
      - name: Check hosted and local frontend JavaScript
        run: |
          node --check static/app.js
          node --check app/static/app.js
